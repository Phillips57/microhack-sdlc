name: Build, test, and deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, provision, and deploy
    runs-on: ubuntu-latest
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_CLIENT_OBJECT_ID: ${{ vars.AZURE_CLIENT_OBJECT_ID }}
      IMAGE_TAG: ${{ github.sha }}
      NAME_PREFIX: octocat
      ENVIRONMENT_NAME: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/api-py/requirements.txt

      - name: Build frontend
        working-directory: src/frontend
        run: |
          npm ci
          npm run build

      - name: Test cart API
        working-directory: src/api-py
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q

      - name: Validate Bicep templates
        run: |
          az bicep build --file infra/resource-group.bicep --stdout > /dev/null
          az bicep build --file infra/main.bicep --stdout > /dev/null

      - name: Validate deployment configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          : "${AZURE_CLIENT_ID:?Set the AZURE_CLIENT_ID GitHub secret}"
          : "${AZURE_TENANT_ID:?Set the AZURE_TENANT_ID GitHub secret}"
          : "${AZURE_SUBSCRIPTION_ID:?Set the AZURE_SUBSCRIPTION_ID GitHub secret}"
          : "${AZURE_RESOURCE_GROUP:?Set the AZURE_RESOURCE_GROUP GitHub variable}"
          : "${AZURE_LOCATION:?Set the AZURE_LOCATION GitHub variable}"
          : "${AZURE_CLIENT_OBJECT_ID:?Set the AZURE_CLIENT_OBJECT_ID GitHub variable}"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify target resource group
        run: |
          az group show \
            --name "$AZURE_RESOURCE_GROUP" \
            --query id \
            --output tsv >/dev/null

      - name: Provision shared infrastructure and registry roles
        id: bootstrap
        run: |
          set -euo pipefail
          az deployment group create \
            --name octocat-bootstrap \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters \
              location="$AZURE_LOCATION" \
              namePrefix="$NAME_PREFIX" \
              environmentName="$ENVIRONMENT_NAME" \
              apiImage=mcr.microsoft.com/azuredocs/containerapps-helloworld:latest \
              frontendImage=mcr.microsoft.com/azuredocs/containerapps-helloworld:latest \
              deployApps=false \
              githubActionsPrincipalId="$AZURE_CLIENT_OBJECT_ID"
          ACR_NAME="$(az deployment group show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name octocat-bootstrap \
            --query properties.outputs.acrName.value \
            --output tsv)"
          ACR_LOGIN_SERVER="$(az deployment group show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name octocat-bootstrap \
            --query properties.outputs.acrLoginServer.value \
            --output tsv)"
          echo "acr_name=$ACR_NAME" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=$ACR_LOGIN_SERVER" >> "$GITHUB_OUTPUT"

      - name: Build and push application images
        env:
          ACR_NAME: ${{ steps.bootstrap.outputs.acr_name }}
          ACR_LOGIN_SERVER: ${{ steps.bootstrap.outputs.acr_login_server }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if az acr login --name "$ACR_NAME"; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Could not authenticate to ACR after role assignment." >&2
              exit 1
            fi
            sleep 10
          done
          docker build \
            --file src/api-py/Dockerfile \
            --tag "$ACR_LOGIN_SERVER/api:$IMAGE_TAG" \
            src
          docker build \
            --file src/frontend/Dockerfile \
            --tag "$ACR_LOGIN_SERVER/frontend:$IMAGE_TAG" \
            src/frontend
          docker push "$ACR_LOGIN_SERVER/api:$IMAGE_TAG"
          docker push "$ACR_LOGIN_SERVER/frontend:$IMAGE_TAG"

      - name: Deploy Container Apps with Bicep
        id: deploy
        env:
          ACR_LOGIN_SERVER: ${{ steps.bootstrap.outputs.acr_login_server }}
        run: |
          set -euo pipefail
          az deployment group create \
            --name octocat-app \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters \
              location="$AZURE_LOCATION" \
              namePrefix="$NAME_PREFIX" \
              environmentName="$ENVIRONMENT_NAME" \
              apiImage="$ACR_LOGIN_SERVER/api:$IMAGE_TAG" \
              frontendImage="$ACR_LOGIN_SERVER/frontend:$IMAGE_TAG" \
              deployApps=true \
              githubActionsPrincipalId="$AZURE_CLIENT_OBJECT_ID"
          FRONTEND_URL="$(az deployment group show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name octocat-app \
            --query properties.outputs.frontendUrl.value \
            --output tsv)"
          echo "frontend_url=$FRONTEND_URL" >> "$GITHUB_OUTPUT"
          echo "Application URL: $FRONTEND_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify live app and cart flow
        env:
          FRONTEND_URL: ${{ steps.deploy.outputs.frontend_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$FRONTEND_URL/" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Frontend did not become reachable: $FRONTEND_URL" >&2
              exit 1
            fi
            sleep 10
          done

          curl --fail --silent --show-error "$FRONTEND_URL/api/products" | jq -e 'length > 0' >/dev/null
          CART_ID="$(python -c 'import uuid; print(uuid.uuid4())')"
          curl --fail --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"productId":1,"quantity":1}' \
            "$FRONTEND_URL/api/cart/$CART_ID/items" | jq -e '.itemCount == 1' >/dev/null
          curl --fail --silent --show-error \
            "$FRONTEND_URL/api/cart/$CART_ID" | jq -e '.itemCount == 1 and .total > 0' >/dev/null
          echo "Frontend and persistent cart flow verified." >> "$GITHUB_STEP_SUMMARY"
